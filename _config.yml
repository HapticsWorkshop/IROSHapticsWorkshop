title: "IROS 2026 Workshop"
description: "Workshop on Haptics and Dexterous Manipulation"
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
plugins:
  - jekyll-include-cache
  - jekyll-feed # the theme footer links to /feed.xml; without this it 404s
  - jekyll-sitemap

minimal_mistakes_skin: "default"
search: false

# Small logo shown in the masthead/navbar (theme caps it at ~2rem tall).
# Path is relative to the site root; the theme prepends the baseurl.
logo: "/assets/images/logos/workshopLogo-horizontal.png"

url: "https://hapticsworkshop.github.io"
baseurl: "/IROSHapticsWorkshop"

markdown: kramdown
permalink: pretty

collections:
  pages:
    output: true
    permalink: /:path/
  # One document per accepted poster (_posters/*.md); listed on /accepted-posters/.
  posters:
    output: true
    permalink: /accepted-posters/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: posters
    values:
      layout: poster
      author_profile: false

# Private submission data lives next to the site but must never be published.
# GitHub Pages runs Jekyll 3.x, where this list *replaces* the built-in
# defaults, so those are repeated here.
exclude:
  - ignore
  - assets/abstracts
  - assets/Formresponses
  - assets/graphical-summaries
  - "assets/Accepted Posters - Sheet1.csv"
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache

sass:
  style: compressed
