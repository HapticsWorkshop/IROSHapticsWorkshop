title: "IROS 2026 Workshop"
description: "Workshop on Haptics and Dexterous Manipulation"
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "default"
search: false

# Small logo shown in the masthead/navbar (theme caps it at ~2rem tall).
# Path is relative to the site root; the theme prepends the baseurl.
logo: "/assets/images/logos/workshopLogo-horizontal.png"

url: "https://hapticsworkshop.github.io"
baseurl: "/IROSHapticsWorkshop"

markdown: kramdown
permalink: pretty

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

sass:
  style: compressed
